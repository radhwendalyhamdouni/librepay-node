name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prisma client
        run: bunx prisma generate
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Prepare database
        run: |
          mkdir -p data
          bunx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./data/ci.db
      - name: Suites (hermetic — onion SSRF guard + chain-health alarms)
        run: |
          bun scripts/test-onion-guard.ts
          bun scripts/test-chain-health.ts
        env:
          DATABASE_URL: file:./data/ci.db
          LP_APP_SECRET: ci-placeholder-secret-not-a-real-key
          LP_WEBHOOK_SECRETS: whsec-ci-placeholder
          LP_ALLOW_LOOPBACK_WEBHOOKS: "true"
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./data/ci.db
          LP_APP_SECRET: ci-placeholder-secret-not-a-real-key
